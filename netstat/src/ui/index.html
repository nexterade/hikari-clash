<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Hikari NetStat</title>
<style>
:root{
  --void:#0a0a12; --panel:#11111d; --panel2:#171726; --line:#26263f; --grid:#1c1c30;
  --ink:#ecebff; --ink2:#a3a3c4; --mute:#6c6c8c;
  --wifi:#00a2c3; --data:#ee3a93; --internal:#8f7dff;      /* warna data: lolos validator (dark, CVD dE 8.7) */
  --neon-c:#00f0ff; --neon-m:#ff2a85; --neon-y:#fcee0a;     /* aksen UI saja, bukan warna data */
  --ui:"Chakra Petch","Bahnschrift","Roboto Condensed","sans-serif-condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"Share Tech Mono",ui-monospace,"JetBrains Mono","Roboto Mono","DejaVu Sans Mono",monospace;
  --cut:14px;
}
*{box-sizing:border-box;margin:0}
html{background:var(--void);-webkit-text-size-adjust:100%}
body{
  min-height:100vh;color:var(--ink);font:500 15px/1.45 var(--ui);
  padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
  background:
    linear-gradient(var(--void),var(--void)) padding-box,
    var(--void);
  background-image:
    linear-gradient(rgba(0,240,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,240,255,.035) 1px,transparent 1px);
  background-size:32px 32px;
  position:relative;
}
body::after{ /* scanline tipis */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);opacity:.28;
}
.wrap{max-width:760px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.wrap>*{min-width:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--neon-y);outline-offset:2px}

/* panel potong sudut */
.panel{
  position:relative;background:var(--panel);padding:16px;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));
}
.panel::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--neon-c),var(--neon-m) 60%,transparent)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:700 20px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 0 14px rgba(0,240,255,.55)}
.brand i{font-style:normal;color:var(--neon-m);text-shadow:0 0 14px rgba(255,42,133,.6)}
.chip{display:inline-flex;align-items:center;gap:8px;font:400 13px/1 var(--mono);color:var(--ink2);padding:7px 10px;background:var(--panel);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.chip b{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.chip[data-s=live] b{background:#3dff9a;box-shadow:0 0 8px #3dff9a}
.chip[data-s=stale] b{background:var(--neon-y)}
.chip[data-s=down] b{background:var(--neon-m);box-shadow:0 0 8px var(--neon-m)}

/* tab granularitas */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{padding:11px 8px;font:700 15px/1 var(--ui);letter-spacing:.06em;color:var(--ink2);background:var(--panel);
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);text-align:center;min-height:44px}
.tab[aria-selected=true]{background:var(--neon-y);color:#15130a}

/* hero */
.hero{padding:18px 16px 16px}
.hero-label{display:flex;justify-content:space-between;gap:10px;align-items:baseline;color:var(--ink2);font-size:14px}
.hero-label b{color:var(--ink);font-weight:700;font-size:16px}
.big{
  font:400 clamp(56px,17vw,92px)/1 var(--mono);letter-spacing:-.02em;margin:10px 0 4px;color:var(--ink);
  text-shadow:-2px 0 0 rgba(0,240,255,.75),2px 0 0 rgba(255,42,133,.75);   /* satu-satunya efek glitch di halaman */
  font-variant-numeric:tabular-nums;white-space:nowrap
}
.big small{font-size:.32em;letter-spacing:0;margin-left:.15em;text-shadow:none;color:var(--ink2)}
.delta{font:400 14px/1.3 var(--mono);color:var(--ink2)}
.delta.up{color:var(--neon-y)} .delta.dn{color:#3dff9a}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tile{background:var(--panel2);padding:12px 12px 12px 14px;position:relative;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.tile h3{font:700 14px/1 var(--ui);color:var(--ink2);display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tile h3 i{width:10px;height:10px;background:var(--c);display:inline-block}
.tile .v{font:400 28px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.tile .s{font:400 13px/1.5 var(--mono);color:var(--ink2);margin-top:6px}
.share{height:6px;background:var(--line);margin-top:10px;display:flex;gap:2px}
.share span{display:block;height:100%}
.internal{margin-top:12px;font:400 13px/1.4 var(--mono);color:var(--mute)}
.internal i{display:inline-block;width:8px;height:8px;background:var(--internal);margin-right:6px}

/* chart */
.chart-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 14px;align-items:center;margin-bottom:10px}
.chart-head h2,.lists h2{font:700 16px/1.2 var(--ui);letter-spacing:.03em}
.legend{display:flex;gap:14px;color:var(--ink2);font-size:14px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.seg{display:flex;gap:6px}
.seg button{font:700 13px/1 var(--ui);padding:9px 12px;min-height:36px;color:var(--ink2);background:var(--panel2)}
.seg button[aria-pressed=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--neon-c)}
.plot{position:relative;touch-action:pan-y}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.plot .col{cursor:pointer}
.tt{position:absolute;z-index:5;pointer-events:none;min-width:168px;background:#05050b;border:1px solid var(--line);padding:9px 11px;
  font:400 13px/1.55 var(--mono);color:var(--ink);box-shadow:0 6px 24px rgba(0,0,0,.6)}
.tt b{display:block;font:700 14px/1.3 var(--ui);margin-bottom:3px}
.tt i{display:inline-block;width:8px;height:8px;margin-right:6px}
.tt[hidden]{display:none}

/* tabel */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font:400 14px/1.3 var(--mono);font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-family:var(--ui);font-weight:500}
th{font:700 13px/1.2 var(--ui);color:var(--ink2)}
tr[aria-current=true] td{color:var(--neon-y)}

/* daftar teratas */
.lists{display:grid;gap:18px}
.list h2{margin-bottom:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 6px;margin:0 -6px;width:calc(100% + 12px);text-align:left;border-bottom:1px solid var(--line)}
button.row:hover,button.row:focus-visible{background:var(--panel2)}
.row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.row .t{font:400 14px/1.3 var(--mono);color:var(--ink2);text-align:right}
.row .bar{grid-column:1/-1;height:4px;display:flex;gap:2px;background:var(--grid)}
.row .bar span{display:block;height:100%}
.empty{color:var(--ink2);padding:18px 4px;line-height:1.6}
.empty code{font-family:var(--mono);color:var(--neon-c)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;color:var(--mute);font:400 12px/1.5 var(--mono)}
.foot a{color:var(--neon-c);text-decoration:none;border-bottom:1px solid currentColor}
.err{background:#1a0a14;color:#ffd5e6;padding:14px 16px;border-left:4px solid var(--neon-m);line-height:1.6}
.err code{font-family:var(--mono);color:var(--neon-y)}

/* ---------- kartu ringkasan ---------- */
.sec{font:700 13px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{position:relative;background:var(--panel);padding:14px;min-width:0;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--neon-c),transparent 70%)}
.card.full{grid-column:1/-1}
.card h2{font:700 14px/1.2 var(--ui);letter-spacing:.03em;color:var(--ink2);margin-bottom:8px}
.card .v{font:400 clamp(26px,8vw,34px)/1.1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.card .v small{font-size:.45em;margin-left:.15em;color:var(--ink2)}
.card .sub{font:400 13px/1.5 var(--mono);color:var(--ink2);margin-top:4px}
.card .empty{padding:6px 0}
.kv{display:flex;justify-content:space-between;gap:10px;font:400 13px/1.7 var(--mono);color:var(--ink2)}
.kv b{font-weight:400;color:var(--ink);text-align:right}
.kv i{display:inline-block;width:8px;height:8px;margin-right:6px}
.warn{margin-top:8px;font:400 13px/1.5 var(--mono);color:var(--neon-y)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wc{display:flex;flex-direction:column;gap:4px}
.wb{height:72px;display:flex;flex-direction:column-reverse;background:var(--grid)}
.wb span{display:block;width:100%}
.wc em{font:400 11px/1 var(--mono);font-style:normal;color:var(--mute);text-align:center}
.wc em.now{color:var(--neon-y)}

/* ---------- form & tombol ---------- */
.form{display:grid;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.form[hidden]{display:none}
.form label,.dm label{display:grid;gap:4px;font:700 13px/1.2 var(--ui);color:var(--ink2)}
.form input,.form select,.dm select,.dm input[type=file]{font:400 15px/1.2 var(--mono);color:var(--ink);background:var(--panel2);
  border:1px solid var(--line);padding:10px;min-height:44px;width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;font:700 14px/1 var(--ui);padding:12px 14px;min-height:44px;
  color:var(--ink);background:var(--panel2);text-decoration:none;box-shadow:inset 0 -2px 0 var(--neon-c)}
.btn.pri{background:var(--neon-y);color:#15130a;box-shadow:none}
details.panel>summary{cursor:pointer;list-style:none;font:700 16px/1.2 var(--ui);letter-spacing:.03em;min-height:24px}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::after{content:"+";float:right;color:var(--neon-c);font-family:var(--mono)}
details.panel[open]>summary::after{content:"\2212"}
.dm{display:grid;gap:12px;margin-top:14px}
.dm p,.dm .help{font:400 13px/1.55 var(--mono);color:var(--ink2)}
.dm hr{border:0;border-top:1px solid var(--line);width:100%}

@media(min-width:700px){
  body{padding-top:28px}
  .lists{grid-template-columns:repeat(3,1fr)}
  .panel{padding:20px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- header: bahasa ---------- */
.top{flex-wrap:wrap}
.top-r{display:flex;align-items:center;gap:8px}
.lang{display:flex;gap:2px}
.lang button{font:700 12px/1 var(--mono);letter-spacing:.06em;padding:8px 10px;min-height:32px;color:var(--ink2);background:var(--panel)}
.lang button[aria-pressed=true]{background:var(--neon-c);color:#04141a}

/* ---------- bisa diklik ---------- */
.chev{display:inline-block;margin-left:8px;color:var(--neon-c);font-weight:400}
.more{font:700 13px/1 var(--ui);color:var(--neon-c);padding:8px 0 2px;min-height:32px}
.more::after{content:" \203A"}
.hero-more{margin-top:6px}
.insights{display:grid;gap:12px}
.insights h2{font:700 16px/1.2 var(--ui);letter-spacing:.03em}
.itiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.itile{display:block;text-align:left;width:100%;background:var(--panel2);padding:11px 12px 11px 14px;min-width:0;position:relative;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.itile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--neon-c);opacity:.55}
button.itile:hover,button.itile:focus-visible{background:#1d1d31}
button.itile::before{opacity:1}
.itile .k{font:700 12px/1.2 var(--ui);color:var(--ink2);margin-bottom:6px}
.itile .v{font:400 20px/1.15 var(--mono);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itile .s{font:400 12px/1.4 var(--mono);color:var(--ink2);margin-top:4px;overflow-wrap:anywhere}
.hours{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px;height:76px;align-items:end}
.hb{height:100%;display:flex;align-items:flex-end;background:var(--grid);padding:0}
.hb span{display:block;width:100%;background:var(--neon-c);opacity:.7}
.hb.pk span{background:var(--neon-y);opacity:1}
.hb:hover span,.hb:focus-visible span{opacity:1}
.hlab{display:flex;justify-content:space-between;font:400 11px/1 var(--mono);color:var(--mute);margin-top:5px}
tr[data-open]{cursor:pointer}
tr[data-open]:hover td,tr[data-open]:focus-visible td{background:var(--panel2)}

/* ---------- kartu info ---------- */
.card .more{display:block}
.card .kv span{min-width:0;overflow-wrap:anywhere}
.card .kv b{white-space:nowrap}
.card .sbar{height:6px;background:var(--line);margin:8px 0 6px}
.card .sbar span{display:block;height:100%;background:var(--neon-c)}
.wc{padding:0;width:100%}
button.wc:hover .wb,button.wc:focus-visible .wb{outline:1px solid var(--neon-c)}

/* ---------- detail (dialog) ---------- */
dialog.dlg{background:transparent;border:0;padding:0;margin:auto auto 0;width:min(580px,100%);max-width:100%;max-height:88vh;color:var(--ink);overflow:visible}
dialog.dlg::backdrop{background:rgba(5,5,11,.76)}
.dlg-in{background:var(--panel);padding:16px 16px max(18px,env(safe-area-inset-bottom));max-height:88vh;overflow:auto;position:relative;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%)}
.dlg-in::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--neon-c),var(--neon-m) 60%,transparent)}
.dlg-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dlg-top h2{flex:1;font:700 17px/1.25 var(--ui);min-width:0;overflow-wrap:anywhere}
.x{width:40px;height:40px;flex:none;font:400 18px/1 var(--mono);background:var(--panel2);color:var(--ink)}
.x[hidden]{display:none}
.dsub{font:400 13px/1.5 var(--mono);color:var(--ink2)}
.dbody{display:grid;gap:14px}
.dbody h3{font:700 13px/1 var(--ui);color:var(--ink2);margin-bottom:8px}
.trend{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;height:70px;align-items:end}
.trend button{height:100%;display:flex;align-items:flex-end;background:var(--grid);padding:0}
.trend span{display:block;width:100%;background:var(--neon-c);opacity:.7}
.trend .on span{background:var(--neon-y);opacity:1}
.trend button:hover span,.trend button:focus-visible span{opacity:1}
.note{font:400 12px/1.5 var(--mono);color:var(--mute)}
@media(min-width:700px){
  dialog.dlg{margin:auto}
  .dlg-in{padding-bottom:18px}
  .itiles{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="brand">Hikari<i>/</i>NetStat</div>
    <div class="top-r">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="id" aria-pressed="false">ID</button>
      </div>
      <div class="chip" id="chip" data-s="down" role="status"><b></b><span id="chipTxt">…</span></div>
    </div>
  </header>

  <div id="err" class="err" hidden></div>

  <h2 class="sec" id="period" data-i="secPeriod"></h2>

  <nav class="tabs" role="tablist" aria-label="Range">
    <button class="tab" role="tab" data-g="daily" aria-selected="true" data-i="tabDaily"></button>
    <button class="tab" role="tab" data-g="weekly" aria-selected="false" data-i="tabWeekly"></button>
    <button class="tab" role="tab" data-g="monthly" aria-selected="false" data-i="tabMonthly"></button>
  </nav>

  <section class="panel hero" aria-live="polite">
    <div class="hero-label"><b id="hTitle">–</b><span id="hRange"></span></div>
    <div class="big" id="hTotal">0<small>B</small></div>
    <div class="delta" id="hDelta"></div>
    <button type="button" class="more hero-more" id="hMore" data-i="details"></button>
    <div class="tiles">
      <div class="tile" style="--c:var(--wifi)">
        <h3><i></i>WiFi</h3><div class="v" id="wTot">0 B</div>
        <div class="s" id="wSub"></div>
      </div>
      <div class="tile" style="--c:var(--data)">
        <h3><i></i><span data-i="mobile"></span></h3><div class="v" id="dTot">0 B</div>
        <div class="s" id="dSub"></div>
      </div>
    </div>
    <div class="share" id="share" aria-hidden="true"></div>
    <div class="internal" id="internal"></div>
  </section>

  <section class="panel insights" aria-label="Usage insights">
    <h2 data-i="insTitle"></h2>
    <div class="itiles" id="itiles"></div>
    <div>
      <h3 class="lbl" style="margin-bottom:8px;font:700 13px/1 var(--ui)" data-i="byHour"></h3>
      <div id="hourBox"></div>
    </div>
  </section>

  <section class="panel">
    <div class="chart-head">
      <h2 id="cTitle"></h2>
      <div class="legend"><span><i style="background:var(--wifi)"></i>WiFi</span><span><i style="background:var(--data)"></i><span data-i="mobile"></span></span></div>
      <div class="seg" role="group" aria-label="View">
        <button id="vChart" aria-pressed="true" data-i="vChart"></button><button id="vTable" aria-pressed="false" data-i="vTable"></button>
      </div>
    </div>
    <div id="chartBox" class="plot"></div>
    <div id="tableBox" class="tbl" hidden></div>
  </section>

  <section class="panel lists" id="lists"></section>

  <section class="cards" aria-label="Summary">
    <article class="card"><h2 data-i="cToday"></h2><div id="cToday"></div></article>
    <article class="card"><h2 data-i="cTopApp"></h2><div id="cTop"></div></article>
    <article class="card"><h2 data-i="cMonth"></h2><div id="cMonth"></div></article>
    <article class="card"><h2 data-i="cStore"></h2><div id="cStore"></div></article>
    <article class="card full"><h2 data-i="cUp"></h2><div id="cUp"></div></article>
    <article class="card full"><h2 data-i="cNet"></h2><div id="cNet"></div></article>
    <article class="card full"><h2 data-i="c7"></h2><div id="cWeek"></div></article>
    <article class="card full">
      <h2 data-i="cLimit"></h2>
      <div id="cLimit"></div>
      <div class="btns" style="margin-top:12px"><button class="btn" id="limEdit" type="button" data-i="limSet"></button></div>
      <div class="form" id="limForm" hidden>
        <label><span data-i="limGb"></span><input id="limGb" type="text" inputmode="decimal" data-ip="limGbPh"></label>
        <label><span data-i="limDay"></span><select id="limDay"></select></label>
        <label><span data-i="limNet"></span><select id="limNet"><option value="data" data-i="optData"></option><option value="wifi" data-i="optWifi"></option><option value="all" data-i="optAll"></option></select></label>
        <div class="btns"><button class="btn pri" id="limSave" type="button" data-i="save"></button><button class="btn" id="limClear" type="button" data-i="limClear"></button></div>
        <div class="sub" id="limMsg" role="status"></div>
      </div>
    </article>
  </section>

  <details class="panel" id="dataPanel">
    <summary data-i="dataTitle"></summary>
    <div class="dm">
      <p data-ih="dataIntro"></p>
      <div class="btns">
        <a class="btn pri" href="/api/export.json" download data-i="dlJson"></a>
        <a class="btn" href="/api/export.csv" download data-i="dlCsv"></a>
      </div>
      <hr>
      <label><span data-i="impFile"></span>
        <input type="file" id="impFile" accept=".json,application/json">
      </label>
      <label><span data-i="impMode"></span>
        <select id="impMode">
          <option value="fill" data-i="mFill"></option>
          <option value="add" data-i="mAdd"></option>
          <option value="replace" data-i="mReplace"></option>
        </select>
      </label>
      <div class="help" id="impHelp"></div>

const $=s=>document.querySelector(s);
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let L=LS.get("hs.lang")==="id"?"id":"en";
const LOC=()=>L==="id"?"id-ID":"en-US";
const t=(k,...a)=>{let s=(T[L][k]!==undefined?T[L][k]:(T.en[k]!==undefined?T.en[k]:k));a.forEach((v,i)=>{s=s.split("{"+i+"}").join(v)});return s};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const U=["B","KB","MB","GB","TB"];
const nf=(v,d)=>v.toLocaleString(LOC(),{minimumFractionDigits:d,maximumFractionDigits:d});
function split(b){let i=0;while(b>=1000&&i<U.length-1){b/=1000;i++}return [b,U[i]]}
function fmt(b){const[v,u]=split(b);return nf(v,v>=100||u==="B"?0:v>=10?1:2)+" "+u}
function fmtBig(b){const[v,u]=split(b);return nf(v,u==="B"?0:v>=100?0:v>=10?1:2)+"<small>"+u+"</small>"}
const compact=b=>{const[v,u]=split(b);return (v>=10||u==="B"?Math.round(v):Math.round(v*10)/10).toString().replace(".",L==="id"?",":".")+u};
const tot=c=>c?c.up+c.down:0;
const NET=n=>n||{up:0,down:0,conns:0};
const etot=e=>tot(NET(e.nets.wifi))+tot(NET(e.nets.data));
const pad=n=>String(n).padStart(2,"0");
const dn=n=>n==="(tanpa app)"?t("noApp"):n==="(lainnya)"?t("others"):n;

/* ---------- tanggal & durasi (label dibuat di klien, ikut bahasa) ---------- */
const dtf=(key,o)=>new Intl.DateTimeFormat(LOC(),Object.assign({timeZone:"UTC"},o)).format(new Date(key.length===7?key+"-01T00:00:00Z":key+"T00:00:00Z"));
const lblDay=k=>dtf(k,{weekday:"short",day:"numeric",month:"short"});
const lblWeek=(a,b)=>dtf(a,{day:"numeric",month:"short"})+" – "+dtf(b,{day:"numeric",month:"short"});
const lblMon=k=>dtf(k,{month:"short",year:"numeric"});
const labelG=(g,e)=>g==="daily"?lblDay(e.key):g==="weekly"?lblWeek(e.start,e.end):lblMon(e.key);
const fmtDT=u=>new Date(u*1000).toLocaleString(LOC(),{timeZone:S?S.tz:undefined,day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false});
const durMin=m=>{m=Math.round(m);const h=Math.floor(m/60);return h?h+t("uh")+" "+(m%60)+t("um"):m+t("um")};
function durSec(s,n){s=Math.max(0,Math.floor(s));const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),p=[];
  if(d)p.push(d+t("ud"));if(d||h)p.push(h+t("uh"));p.push(m+t("um"));return p.slice(0,n||3).join(" ")}
const hrRange=h=>pad(h)+":00–"+pad((h+1)%24)+":00";

let S=null,DV=null,DVat=0,gran="daily",sel=null,view="chart",DT=null;
const GK={daily:"Daily",weekly:"Weekly",monthly:"Monthly"};
const entryOf=(g,key)=>S&&S[g].find(x=>x.key===key);

/* ---------- bahasa ---------- */
function applyStatic(){
  document.documentElement.lang=L;
  document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=t(el.dataset.i)});
  document.querySelectorAll("[data-ih]").forEach(el=>{el.innerHTML=t(el.dataset.ih)});
  document.querySelectorAll("[data-ip]").forEach(el=>{el.placeholder=t(el.dataset.ip)});
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===L));
  $("#dClose").setAttribute("aria-label",t("dClose"));$("#dBack").setAttribute("aria-label",t("dBack"));
  impHelp();
}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{
  if(b.dataset.lang===L)return;L=b.dataset.lang;LS.set("hs.lang",L);applyStatic();
  if(S)render();else load();
  if(DV)drawNet();
}));

/* ---------- status & muat data ---------- */
let CH=["down","connecting",[]];
function setChip(s,k,...a){CH=[s,k,a];const c=$("#chip");c.dataset.s=s;$("#chipTxt").textContent=t(k,...a)}
const showErr=h=>{const el=$("#err");el.hidden=false;el.innerHTML=h};
async function load(){
  try{
    const r=await fetch("/api/summary",{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    S=await r.json(); $("#err").hidden=true; render();
  }catch(e){
    S=null;showErr(t("errConn"));setChip("down","collectorDown");
  }
}
async function loadDevice(){
  try{const r=await fetch("/api/device",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);DV=await r.json();DVat=Date.now()}
  catch(e){DV=null}
  drawNet();
}

function render(){
  const st=S.status, age=S.generated-st.lastPoll;
  if(st.ok&&age<20) setChip("live","live",new Date(S.generated*1000).toLocaleTimeString(LOC(),{hour12:false,timeZone:S.tz}));
  else if(st.ok) setChip("stale","stale",age);
  else{setChip("down","mihomoDown");showErr(t("errMihomo",esc(st.lastErr||t("noResp"))))}
  const series=S[gran];
  const i=sel&&series.some(e=>e.key===sel)?series.findIndex(e=>e.key===sel):series.length-1;
  const e=series[i], p=i>0?series[i-1]:null;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.g===gran));
  const w=NET(e.nets.wifi), d=NET(e.nets.data), n=NET(e.nets.internal), T=tot(w)+tot(d);

  $("#hTitle").textContent=e.active?t("now"+GK[gran]):labelG(gran,e);
  $("#hRange").textContent=gran==="daily"?lblDay(e.key):(dtf(e.start,{day:"numeric",month:"short"})+" → "+dtf(e.end,{day:"numeric",month:"short",year:"numeric"}));
  $("#hTotal").innerHTML=fmtBig(T);
  let dl="";
  if(p){const pt=etot(p);
    if(pt>0){const pc=(T-pt)/pt*100;
      dl=t("vsPrev",(pc>=0?"▲ ":"▼ ")+nf(Math.abs(pc),0)+"%",e.active?t("prev"+GK[gran]):t("prevPeriod"),fmt(pt))+(e.active?t("partial"):"");
      $("#hDelta").className="delta "+(pc>5?"up":pc<-5?"dn":"")}
    else{dl=t("noCompare");$("#hDelta").className="delta"}}
  $("#hDelta").textContent=dl;
  const hm=$("#hMore");hm.dataset.open="period";hm.dataset.g=gran;hm.dataset.key=e.key;
  $("#wTot").textContent=fmt(tot(w));$("#dTot").textContent=fmt(tot(d));
  $("#wSub").innerHTML="↓ "+fmt(w.down)+"<br>↑ "+fmt(w.up)+"<br>"+t("seenConns",nf(w.conns,0));
  $("#dSub").innerHTML="↓ "+fmt(d.down)+"<br>↑ "+fmt(d.up)+"<br>"+t("seenConns",nf(d.conns,0));
  const sh=$("#share");
  if(T>0){sh.hidden=false;sh.innerHTML='<span style="width:'+(tot(w)/T*100)+'%;background:var(--wifi)"></span><span style="width:'+(tot(d)/T*100)+'%;background:var(--data)"></span>'}else sh.hidden=true;
  $("#internal").innerHTML=tot(n)>0?'<i></i>'+t("internal",fmt(tot(n))):"";

  $("#cTitle").textContent=t("title"+GK[gran]);
  drawInsights(gran,e);drawChart(series,i);drawTable(series,i);drawLists(gran,e);drawCards();drawNet();
  const f=$("#fLeft");f.textContent=t("footer",new Date(S.started*1000).toLocaleDateString(LOC(),{timeZone:S.tz,day:"numeric",month:"short",year:"numeric"}),(S.wifiCidrs||[]).join(", "),S.tz);
  if($("#dlg").open&&DT)renderDetail();
}

/* ---------- wawasan pemakaian ---------- */
function peakHour(e){
  if(!e.hours||e.hours.length!==24)return null;
  const mx=Math.max(...e.hours);if(mx<=0)return null;
  return {h:e.hours.indexOf(mx),b:mx};
}
function daysInRange(e){
  const a=Date.parse(e.start+"T00:00:00Z"); let b=Date.parse(e.end+"T00:00:00Z");
  if(e.active){const today=Date.parse(S.daily[S.daily.length-1].key+"T00:00:00Z");b=Math.min(b,today)}
  return Math.max(1,Math.round((b-a)/864e5)+1);
}
const topOf=(e,dim)=>((e.top&&e.top[dim])||[]).find(x=>x.name!=="(lainnya)");
function itile(k,v,s,attrs){
  const inner='<div class="k">'+esc(k)+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div>';
  return attrs?'<button type="button" class="itile" '+attrs+'>'+inner+'</button>':'<div class="itile">'+inner+'</div>';
}
function drawInsights(g,e){
  const T=etot(e), am=e.activeMin||0, ph=peakHour(e), tiles=[];
  tiles.push(itile(t("iActive"),am>0?durMin(am):"–",am>0&&T>0?esc(t("perActHour",fmt(T/(am/60)))):"&nbsp;"));
  tiles.push(ph?itile(t("iHour"),pad(ph.h)+":00",esc(fmt(ph.b)+" · "+nf(T>0?ph.b/T*100:0,0)+"%"),'data-open="hour" data-g="'+g+'" data-key="'+esc(e.key)+'" data-h="'+ph.h+'"'):itile(t("iHour"),"–","&nbsp;"));
  const ta=topOf(e,"proc"), tr=topOf(e,"group");
  const itemAttr=(dim,x)=>'data-open="item" data-dim="'+dim+'" data-name="'+esc(x.name)+'" data-g="'+g+'" data-key="'+esc(e.key)+'"';
  tiles.push(ta?itile(t("iTopApp"),esc(dn(ta.name)),esc(fmt(ta.wifi+ta.data)),itemAttr("proc",ta)):itile(t("iTopApp"),"–","&nbsp;"));
  tiles.push(tr?itile(t("iTopRoute"),esc(dn(tr.name)),esc(fmt(tr.wifi+tr.data)),itemAttr("group",tr)):itile(t("iTopRoute"),"–","&nbsp;"));
  if(g!=="daily"){
    const pd=e.peakDay, can=pd&&S.daily.some(x=>x.key===pd.key);
    tiles.push(pd?itile(t("iPeakDay"),esc(lblDay(pd.key)),esc(fmt(pd.total)),can?'data-open="period" data-g="daily" data-key="'+esc(pd.key)+'"':""):itile(t("iPeakDay"),"–","&nbsp;"));
    const du=e.daysUsed||0;
    tiles.push(du>0?itile(t("iAvgDay"),esc(fmt(T/du)),esc(t("daysWith",du,daysInRange(e)))):itile(t("iAvgDay"),"–","&nbsp;"));
  }
  $("#itiles").innerHTML=tiles.join("");
  $("#hourBox").innerHTML=hourStrip(e,{g,key:e.key});
}
function hourStrip(e,ctx){
  const H=e.hours&&e.hours.length===24?e.hours:null, mx=H?Math.max(...H):0;
  if(!H||mx<=0)return '<div class="empty">'+esc(t("noHours"))+'</div>';
  const pk=H.indexOf(mx);
  return '<div class="hours" role="group" aria-label="'+esc(t("hoursAria"))+'">'+H.map((v,h)=>

/* ---------- grafik ---------- */
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),m=v/e;return (m<=1?1:m<=2?2:m<=5?5:10)*e}
function drawChart(series,iSel){
  const box=$("#chartBox"), W=Math.max(280,box.clientWidth||340), H=210, Lm=38, R=4, Tm=8, B=22;
  const pw=W-Lm-R, ph=H-Tm-B, n=series.length, slot=pw/n, bw=Math.min(24,slot*.68);
  const vals=series.map(e=>[tot(NET(e.nets.wifi)),tot(NET(e.nets.data))]);
  const max=niceMax(Math.max(...vals.map(v=>v[0]+v[1]),1)), y=v=>Tm+ph-v/max*ph;
  let g="";
  for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);
    g+='<line x1="'+Lm+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--grid)" stroke-width="1"/>'+
       '<text x="'+(Lm-6)+'" y="'+(yy+4)+'" text-anchor="end" fill="var(--mute)" font-size="11" font-family="var(--mono)">'+(k?compact(v):"0")+'</text>'}
  let bars="",xl="";
  series.forEach((e,i)=>{
    const cx=Lm+slot*i+slot/2, x=cx-bw/2, [a,b]=vals[i], op=i===iSel?1:.74;
    const hA=a/max*ph, hB=b/max*ph, gap=(hA>2&&hB>2)?2:0;
    if(hA>0.5) bars+=pathBar(x,y(a),bw,Math.max(hA-(hB>0?gap:0),1),b<=0,"var(--wifi)",op);
    if(hB>0.5) bars+=pathBar(x,y(a+b),bw,Math.max(hB,1),true,"var(--data)",op);
    const lbl=labelFor(e,i,n); if(lbl) xl+='<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle" fill="'+(i===iSel?"var(--neon-y)":"var(--mute)")+'" font-size="11" font-family="var(--mono)">'+lbl+'</text>';
    bars+='<rect class="col" data-i="'+i+'" x="'+(cx-slot/2)+'" y="'+Tm+'" width="'+slot+'" height="'+(ph+B)+'" fill="transparent"/>';
  });
  box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" tabindex="0" aria-label="'+esc(t("titleDaily"))+'">'+g+bars+xl+'</svg><div class="tt" hidden></div>';
  const svg=box.querySelector("svg"), tt=box.querySelector(".tt");
  const show=i=>{const e=series[i],w=NET(e.nets.wifi),d=NET(e.nets.data);
    tt.innerHTML="<b>"+esc(labelG(gran,e))+"</b><i style=\"background:var(--wifi)\"></i>WiFi "+fmt(tot(w))+"<br><i style=\"background:var(--data)\"></i>"+esc(t("colData"))+" "+fmt(tot(d))+"<br>"+esc(t("colTotal"))+" "+fmt(tot(w)+tot(d));
    tt.hidden=false;const cx=(Lm+slot*i+slot/2)/W*box.clientWidth, tw=tt.offsetWidth;
    tt.style.left=Math.max(0,Math.min(box.clientWidth-tw,cx-tw/2))+"px";tt.style.top="0px"};
  svg.addEventListener("pointermove",ev=>{const c=ev.target.closest(".col");if(c)show(+c.dataset.i)});
  svg.addEventListener("pointerleave",()=>tt.hidden=true);
  svg.addEventListener("click",ev=>{const c=ev.target.closest(".col");if(c){sel=series[+c.dataset.i].key;render()}});
  svg.addEventListener("keydown",ev=>{const k=ev.key;if(k!=="ArrowLeft"&&k!=="ArrowRight")return;ev.preventDefault();
    const ni=Math.max(0,Math.min(n-1,iSel+(k==="ArrowLeft"?-1:1)));sel=series[ni].key;render();$("#chartBox svg").focus()});
}
function pathBar(x,yTop,w,h,roundTop,fill,op){
  const r=roundTop?Math.min(4,w/2,h):0, yb=yTop+h;
  const d="M"+x+","+yb+"V"+(yTop+r)+(r?"Q"+x+","+yTop+" "+(x+r)+","+yTop+"H"+(x+w-r)+"Q"+(x+w)+","+yTop+" "+(x+w)+","+(yTop+r):"V"+yTop+"H"+(x+w))+"V"+yb+"Z";
  return '<path d="'+d+'" fill="'+fill+'" opacity="'+op+'"/>'}
function labelFor(e,i,n){
  if(gran==="daily"){return (n-1-i)%5===0?+e.key.slice(8):""}
  if(gran==="weekly"){return i%2===(n-1)%2?(+e.start.slice(8))+"/"+(+e.start.slice(5,7)):""}
  return dtf(e.key,{month:"short"})}

  try{
    const r=await fetch("/api/import?mode="+m,{method:"POST",headers:{"X-Hikari":"1","Content-Type":"application/json"},body:f});
    const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||("HTTP "+r.status));
    out.textContent=t("impDone",j.added,j.merged,j.skipped,j.days)+(j.backup?t("impBak",j.backup):"");
    $("#impFile").value="";load();
  }catch(e){out.textContent=t("impFail",e.message)}
};

/* ---------- interaksi ---------- */
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{gran=b.dataset.g;sel=null;if(S)render()}));
$("#vChart").onclick=()=>setView("chart");$("#vTable").onclick=()=>setView("table");
function setView(v){view=v;$("#chartBox").hidden=v!=="chart";$("#tableBox").hidden=v!=="table";
  $("#vChart").setAttribute("aria-pressed",v==="chart");$("#vTable").setAttribute("aria-pressed",v==="table");if(S)render()}
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>S&&render(),120)});

/* boot: angka total naik sekali saat pertama muncul */
let booted=false;
const _render=render;
render=function(){
  if(!booted&&!reduce()&&S){
    booted=true;const el=$("#hTotal");_render();const t0=performance.now();
    const target=(()=>{const s=S[gran];return etot(s[s.length-1])})();
    (function step(ts){const k=Math.min(1,(ts-t0)/650),ea=1-Math.pow(1-k,3);el.innerHTML=fmtBig(target*ea);if(k<1)requestAnimationFrame(step);else el.innerHTML=fmtBig(target)})(t0);
  }else{booted=true;_render()}
};
applyStatic();setChip("down","connecting");
load();setInterval(()=>{if(!document.hidden)load()},10000);
loadDevice();setInterval(()=>{if(!document.hidden)loadDevice()},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){load();loadDevice()}});
</script>
